<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ask AI - {{ chapter|title }}</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 700px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
        }

        .chapter {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #667eea;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #388e3c;
        }

        .answer {
            margin-top: 30px;
            background: #f1f5ff;
            padding: 20px;
            border-radius: 15px;
            line-height: 1.7;
            font-size: 17px;
            color: #333;
        }

        .answer h3 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #1e3a8a;
            font-weight: bold;
        }

        .back:hover {
            color: #2563eb;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>
            🤖 Ask AI Tutor
        </h1>

        <div class="chapter">
            Chapter: {{ chapter|title }}
        </div>


        <form method="POST">

            <textarea
                name="question"
                placeholder="Ask your doubt here..."
                required></textarea>

            <button type="submit">
                Ask Question 🚀
            </button>

        </form>


        {% if answer %}

        <div class="answer">

            <h3>
                AI Answer:
            </h3>

            {{ answer | safe }}

        </div>

        {% endif %}


        <a class="back"
           href="{{ url_for('computerbasics') }}">

            ⬅ Back to Chapter

        </a>

    </div>

</body>

</html>
